[project]
name = "bluhands-agent"
version = "0.1.0"
description = "BluHands autonomous coding agent service (OpenHands SDK + custom tools/skills)."
requires-python = ">=3.11"
# Loose lower-bounds only — exact pins fight OpenHands' own requirements and
# cause pip ResolutionImpossible. Let the resolver pick compatible versions.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "openai>=1.0",
]

[project.optional-dependencies]
# Heavy deps only needed for a REAL (non-dry-run) build. Kept optional so the
# service + tests run offline. NOT a fork of OpenHands (ADR-1).
# openhands-sdk and openhands-tools are a MATCHED SET — they must be the exact
# same version (tools imports sdk internals like openhands.sdk.subagent). Pin
# both to the same release or imports break. agent-server is unused here.
agent = [
  "openhands-sdk==1.24.0",
  "openhands-tools==1.24.0",
  "playwright",
  "e2b>=2.1",  # prod sandbox provider (ADR-10); LiteLLM ships with openhands-sdk
]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "anyio==4.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
