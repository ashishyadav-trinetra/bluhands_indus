# Host nginx for app.bluehands.ai (NOT the docker nginx).
# Install:  sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/bluhands
#           sudo nginx -t && sudo nginx -s reload
#
# Routing:
#   /api/v1/{settings,skills,secrets,users/git-info} -> openhands app-server :3000
#   /forge/                                           -> forge control-plane  :8001
#   /                                                 -> frontend container   :3300
server {
    listen 80;
    listen [::]:80;
    server_name app.bluehands.ai 54.87.249.176;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://app.bluehands.ai$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.bluehands.ai 54.87.249.176;
    ssl_certificate     /etc/letsencrypt/live/app.bluehands.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.bluehands.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    client_max_body_size 25m;

    # OpenHands app-server: settings / skills / secrets (regex beats / prefix)
    location ~ ^/api/v1/(settings|skills|secrets|users/git-info) {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /forge/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass         http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
