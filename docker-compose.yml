# ─────────────────────────────────────────────────────────────────────────────
# BluHands — unified development stack (one command brings up everything).
#
#   docker compose up --build
#
# It INCLUDES the control-plane's own compose (api, worker, flower, db, cache,
# storage, nginx — all health-checked) and adds: the agent, the frontend, and
# monitoring (Prometheus + Grafana). It also flips the control-plane to call the
# REAL agent over HTTP (FORGE_AGENT_MODE=http), wiring control-plane → agent.
#
# Prereqs (see STARTUP.md): rename `bluhands-agent/` → `agent/`; create
# control-plane/.env.development and control-plane/secrets (RS256 keys); set
# OPENROUTER_API_KEY / E2B_API_KEY in your shell or .env at this root.
# ─────────────────────────────────────────────────────────────────────────────

include:
  - control-plane/docker-compose.yml

# FORGE_AGENT_MODE=http and FORGE_AGENT_BASE_URL are set in
# control-plane/.env.development (or .env.production) so the included
# api/worker services pick them up without conflicting with the include.

services:
  # OpenHands OSS app-server (vendored in ./openhands-server). Serves the v1 API
  # the frontend needs: /api/v1/settings, agent-schema, skills, secrets,
  # conversations. nginx routes settings|skills|secrets here; forge owns the rest
  # of /api/v1. Auth is OPEN (no SESSION_API_KEY) — forge enforces real auth.
  openhands:
    build:
      context: ./openhands-server
      dockerfile: Dockerfile
    environment:
      # OSS mode: no SESSION_API_KEY → settings/skills endpoints return JSON
      # without auth. (Do NOT set SESSION_API_KEY here, or the UI gets 401s.)
      SERVE_FRONTEND: "false"           # the `frontend` service serves the UI
      RUNTIME: "process"                # in-container process sandbox for convos
      CORS_ALLOWED_ORIGINS: "*"
      # Each conversation's agent-server runs on a dynamic in-container port.
      # Hand the BROWSER a proxyable URL (https://host/runtime/{port}/...) instead
      # of a raw localhost:{port}; nginx reverse-proxies /runtime/{port}/ to it.
      SANDBOX_CONTAINER_URL_PATTERN: "https://app.bluehands.ai/runtime/{port}"
      # ── Multi-tenant identity (per-user isolation) ───────────────────────────
      # Setting SUPABASE_URL is the MASTER SWITCH: server_config.py then selects
      # SupabaseUserAuth (real per-user id from the JWT) + per-user Supabase
      # settings/secrets stores. Without it the app-server is SINGLE-USER and
      # every login shares one account. Requires the user_settings + user_secrets
      # tables in Supabase (see deploy/MULTI-TENANCY.md). Token verification now
      # supports ES256 via JWKS (derived from SUPABASE_URL if JWKS_URL unset).
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_JWKS_URL: "${SUPABASE_JWKS_URL:-}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET:-}"
      WEB_HOST: "${WEB_HOST:-app.bluehands.ai}"
      # ── Admin model/key seed ─────────────────────────────────────────────────
      # Platform admins (emails below) get the company model + OpenRouter key
      # seeded into their per-user settings on first login, so THEY can build on
      # the company key. Normal users get nothing → they must upgrade and can
      # never use this key. Set BLUHANDS_ADMIN_EMAILS in .env (comma-separated).
      BLUHANDS_ADMIN_EMAILS: "${BLUHANDS_ADMIN_EMAILS:-}"
      BLUHANDS_PLATFORM_LLM_MODEL: "${BLUHANDS_PLATFORM_LLM_MODEL:-openrouter/anthropic/claude-sonnet-4.5}"
      BLUHANDS_PLATFORM_LLM_API_KEY: "${OPENROUTER_API_KEY:-}"
      BLUHANDS_PLATFORM_LLM_BASE_URL: "https://openrouter.ai/api/v1"
      # ── Self-hosted model for org users (no key, no upgrade) ─────────────────
      # Users whose email domain is in BLUHANDS_SELFHOSTED_DOMAINS get pinned to
      # your self-hosted endpoint (e.g. Qwen on the DGX box). Set these in .env:
      #   BLUHANDS_SELFHOSTED_DOMAINS=trinetralabs.ai
      #   BLUHANDS_SELFHOSTED_BASE_URL=http://<dgx-ip>:<port>/v1
      #   BLUHANDS_SELFHOSTED_MODEL=openai/<served-model-name>   (LiteLLM slug)
      BLUHANDS_SELFHOSTED_DOMAINS: "${BLUHANDS_SELFHOSTED_DOMAINS:-}"
      BLUHANDS_SELFHOSTED_BASE_URL: "${BLUHANDS_SELFHOSTED_BASE_URL:-}"
      BLUHANDS_SELFHOSTED_MODEL: "${BLUHANDS_SELFHOSTED_MODEL:-}"
      BLUHANDS_SELFHOSTED_API_KEY: "${BLUHANDS_SELFHOSTED_API_KEY:-sk-local}"
      # LLM is configured per-user via the UI Settings page (settings store).
      # OPENROUTER_API_KEY is exposed so LiteLLM can route openrouter/* models.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      E2B_API_KEY: "${E2B_API_KEY:-}"
    volumes:
      - openhands_data:/root/.openhands          # settings/secrets persistence
      - openhands_workspace:/app/workspace        # conversation workspace
    # The app-server runs each conversation's agent-server as an in-container
    # subprocess (RUNTIME=process). OpenHands rewrites localhost ->
    # host.docker.internal for cross-container Docker setups; in our single-
    # container model that breaks the agent-server health check. Map it back to
    # the container itself so the rewrite resolves to the local subprocess.
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    ports:
      - "3000:3000"
      # Per-conversation agent-servers listen on 18000+. Publish a range so the
      # HOST nginx can reverse-proxy /runtime/{port}/ to them. (They must bind
      # 0.0.0.0 inside the container for this to work — verify; see notes.)
      - "18000-18030:18000-18030"
    restart: on-failure
    healthcheck:
      # agent-schema needs no auth/DB — a 200 here proves the v1 API is live.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/api/v1/settings/agent-schema').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # The autonomous coding agent (OpenHands SDK + E2B sandbox).
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        # 0 = base image (dry-run, fast). 1 = install the OpenHands SDK stack for
        # REAL builds (slower; uses uv to resolve the dep tree).
        INSTALL_AGENT: "${INSTALL_AGENT:-0}"
    environment:
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8100"
      AGENT_DRY_RUN: "${AGENT_DRY_RUN:-true}"          # set false for real builds
      AGENT_SANDBOX_PROVIDER: "${AGENT_SANDBOX_PROVIDER:-local}"  # 'e2b' in prod
      AGENT_ENV: "${AGENT_ENV:-development}"           # 'production' refuses local sandbox
      AGENT_E2B_TEMPLATE: "${AGENT_E2B_TEMPLATE:-bluhands-node}"
      AGENT_MAX_CONCURRENT_BUILDS: "${AGENT_MAX_CONCURRENT_BUILDS:-4}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      E2B_API_KEY: "${E2B_API_KEY:-}"
      # Persistence: workspace survives agent restarts (named volume below).
      AGENT_WORKSPACE_ROOT: "/var/bluhands-builds"
      # Base URL of the reverse proxy that exposes sandbox ports to users.
      # The agent injects this into every build prompt so the app configures
      # CORS, cookies, and NEXT_PUBLIC_APP_URL against the proxy, not localhost.
      AGENT_PREVIEW_PROXY_BASE: "${AGENT_PREVIEW_PROXY_BASE:-https://app.bluehands.ai/runtime}"
      # JobStore backs to Redis so in-flight job status survives restarts.
      # Points at the control-plane's cache service on the shared compose network.
      AGENT_REDIS_URL: "redis://cache:6379/1"
    volumes:
      - bluhands_builds:/var/bluhands-builds
    depends_on:
      cache:
        condition: service_healthy
    ports:
      - "8100:8100"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The product front door (your customized OpenHands UI).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes VITE_* at build time — pass them as build args so the image
      # actually has them.  Set the real values in a .env file at this root.
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
        VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:-}"
    environment:
      # Runtime env vars (for anything not Vite-baked).
      VITE_MOCK_API: "false"
    ports:
      - "3300:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  # ── Monitoring ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bluhands_promdata:/prometheus
    ports:
      - "9090:9090"
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - bluhands_grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: on-failure

volumes:
  bluhands_promdata:
  bluhands_grafanadata:
  bluhands_builds:      # agent workspace — persists generated code across restarts
  openhands_workspace:  # OpenHands conversation workspace
  openhands_data:       # app-server settings/secrets store (~/.openhands)
