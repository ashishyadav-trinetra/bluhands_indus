# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — DEVELOPMENT config
#
# Routing:
#   /forge/…        → forge control-plane (api:8000)  — strips /forge prefix
#   /api/v1/…       → forge control-plane (api:8000)  — direct (no prefix)
#   /ws             → OpenHands server (openhands:3000) — WebSocket
#   /socket.io/…    → OpenHands server (openhands:3000) — WebSocket fallback
#   /api/…          → OpenHands server (openhands:3000) — conversations, options
#   /health/live    → forge control-plane (healthcheck)
#   /               → frontend (frontend:3000)
# ─────────────────────────────────────────────────────────────────────────────
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    autoindex     off;
    client_max_body_size 25m;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/s;

    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream forge_api {
        server api:8000;
    }

    upstream openhands {
        server openhands:3000;
    }

    upstream forge_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── Liveness (used by nginx healthcheck) ──────────────────────────────
        location = /health/live {
            proxy_pass http://forge_api;
            access_log off;
        }

        # ── Forge control-plane: /forge/… prefix (strip before proxying) ──────
        location /forge/ {
            rewrite ^/forge/(.*) /$1 break;
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ── OpenHands-owned /api/v1/ paths (more specific → take precedence) ─────
        location ~ ^/api/v1/(settings|skills|secrets|users/git-info) {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://openhands;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Forge control-plane: direct /api/v1/… (used in dev without prefix) ─
        location /api/v1/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ── OpenHands WebSocket ───────────────────────────────────────────────
        location /ws {
            proxy_pass http://openhands;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /socket.io/ {
            proxy_pass http://openhands;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── OpenHands REST API (conversations, options, github, etc.) ─────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://openhands;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ── Frontend (everything else) ────────────────────────────────────────
        location / {
            proxy_pass http://forge_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
