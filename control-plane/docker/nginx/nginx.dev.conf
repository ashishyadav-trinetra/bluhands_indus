# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — DEVELOPMENT config (plain HTTP, no TLS, no frontend dep).
# Used by docker-compose.yml. Production TLS config lives in nginx.conf.
# Works on stock nginx:alpine (no ngx_headers_more required).
# ─────────────────────────────────────────────────────────────────────────────
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;            # do not leak nginx version
    autoindex     off;
    client_max_body_size 25m;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/s;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"request_id":"$http_x_request_id","rt":$request_time}';
    access_log /var/log/nginx/access.log json_combined;

    # WebSocket upgrade support: maps the Upgrade header so proxied WS/socket.io
    # connections aren't dropped (they were, which contributed to the 'Starting' hang).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream forge_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

        location /health/live {
            proxy_pass http://forge_api;
        }

        location ~ ^/api/v1/auth/(login|register|refresh) {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://forge_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
