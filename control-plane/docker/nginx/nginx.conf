# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — production configuration (T-700)
#
# TLS termination, HTTP→HTTPS redirect, hardened security headers,
# IP-level rate limiting, gzip, payload cap, no directory listing.
#
# Prerequisites:
#   - TLS cert/key mounted at /etc/nginx/certs/ (managed by Certbot/cert-manager)
#   - dhparam.pem at /etc/nginx/certs/dhparam.pem (openssl dhparam -out ... 4096)
#   - Upstream services: api:8000, frontend:3000
# ─────────────────────────────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Baseline hardening ────────────────────────────────────────────────────
    server_tokens   off;          # never emit "nginx/x.y.z"
    autoindex       off;          # no directory listing
    client_max_body_size 25m;     # payload cap (app enforces its own limit too)

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml;

    # ── TLS tuning ────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Rate-limit zones (IP-level; app enforces per-user limits on top) ──────
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m   rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m    rate=100r/s;
    limit_req_zone  $binary_remote_addr zone=webhook_zone:5m rate=30r/m;
    limit_req_status 429;

    # ── Structured JSON access log ────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"request_id":"$http_x_request_id","rt":$request_time,'
        '"bytes":$body_bytes_sent,"referrer":"$http_referer",'
        '"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream forge_api {
        server api:8000;
        keepalive 32;
    }

    upstream forge_frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect (port 80) ───────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let Certbot renewal challenges through.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — API + dashboard ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.bluhands.dev;        # replace with actual domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_dhparam         /etc/nginx/certs/dhparam.pem;

        # ── Security headers ───────────────────────────────────────────────────
        # nosniff: prevent MIME-type sniffing
        add_header X-Content-Type-Options   "nosniff"                          always;
        # frame-ancestors: clickjacking protection
        add_header X-Frame-Options          "DENY"                             always;
        # HSTS: 2 years, include subdomains, preload-ready
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Referrer: send origin on same-origin, nothing cross-origin
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        # Permissions: deny all sensor/hardware APIs
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
        # CSP: tight policy; frontend overrides per-page via meta tag if needed
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'nonce-$request_id'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data: https:; "
            "connect-src 'self'; "
            "font-src 'self'; "
            "frame-ancestors 'none'; "
            "base-uri 'self'; "
            "form-action 'self'"
            always;
        # Note: `server_tokens off` (above) already hides the nginx version.
        # To strip the Server header entirely, use an nginx image with the
        # ngx_headers_more module (e.g. fholzer/nginx-more) and add:
        #   more_clear_headers Server;

        # ── Liveness — no rate limit ───────────────────────────────────────────
        location = /health/live {
            proxy_pass http://forge_api;
            access_log off;
        }

        location ~ ^/health {
            proxy_pass http://forge_api;
            access_log off;
        }

        # ── Auth endpoints — strict IP rate limit ──────────────────────────────
        location ~ ^/api/v1/auth/(login|register|refresh) {
            limit_req zone=auth_zone burst=3 nodelay;
            limit_req_log_level warn;

            proxy_pass         http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Request-ID    $request_id;
        }

        # ── Payment webhooks — dedicated zone ─────────────────────────────────
        location ~ ^/api/v1/webhooks/payments {
            limit_req zone=webhook_zone burst=10 nodelay;

            proxy_pass         http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Request-ID    $request_id;
        }

        # ── Prometheus metrics — internal only (firewall should also block) ────
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://forge_api;
        }

        # ── All other API routes ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass         http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Request-ID    $request_id;
        }

        # ── Frontend (Next.js dashboard) ───────────────────────────────────────
        location / {
            limit_req zone=api_zone burst=100 nodelay;

            proxy_pass         http://forge_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
