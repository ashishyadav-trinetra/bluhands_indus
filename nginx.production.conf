# ─────────────────────────────────────────────────────────────────────────────
# System nginx — EC2 production config for app.bluhands.ai
#
# INSTALL ON SERVER:
#   sudo cp nginx.production.conf /etc/nginx/sites-available/bluhands
#   sudo ln -s /etc/nginx/sites-available/bluhands /etc/nginx/sites-enabled/bluhands
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo certbot --nginx -d app.bluhands.ai   # issues + installs TLS cert
#   sudo nginx -t && sudo systemctl reload nginx
#
# WHAT THIS DOES:
#   - Port 80  → redirect to HTTPS
#   - Port 443 → serve React static files from /home/ubuntu/openhands/frontend/build
#              → proxy /api/ /socket.io/ /ws/ to OpenHands on localhost:3000
#              → proxy /forge/ to the Docker compose control-plane on localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name app.bluhands.ai;

    # Certbot ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.bluhands.ai;

    # ── TLS (Certbot fills these in automatically) ─────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/app.bluhands.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.bluhands.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_vary on;

    client_max_body_size 25m;

        # ── BluHands control-plane API (Docker compose on port 8001) ────────────
    location /forge/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── BluHands React frontend (Docker compose frontend on port 3300) ────────
    location / {
        proxy_pass         http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
