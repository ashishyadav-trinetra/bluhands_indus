name: Deploy to EC2

# Push to main → SSH into the server → pull + rebuild only what changed.
# Manual runs allowed via the "Run workflow" button (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 40m        # docker builds (Chromium, frontend) are slow
          script_stop: true           # stop on first failed command
          script: |
            set -e
            cd ~/var/www/bluhands_indus
            bash scripts/deploy.sh
